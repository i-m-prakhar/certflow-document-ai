[project]
name = "certflow-ai"
version = "1.0.0"
description = "Auditable PDF extraction, validation and grounded hybrid retrieval"
requires-python = ">=3.11,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3",
 "pymupdf>=1.24,<2", "python-multipart>=0.0.9,<1", "reportlab>=4.2,<5",
 "numpy>=1.26,<3", "prometheus-client>=0.20,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]
agents = ["langgraph>=0.6,<2"]
embeddings = ["sentence-transformers>=3.0,<6"]
ocr = ["pytesseract>=0.3.13,<1", "pillow>=10,<13"]
[project.scripts]
certflow = "certflow.cli:main"
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/certflow"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E9", "F"]
